name: Publish native CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Guard contracts
        working-directory: WinSecAgent
        run: python -X utf8 -m unittest discover -s backend/tests -p test_guard.py -v
      - name: Native distributions
        working-directory: WinSecAgent
        run: python -X utf8 -m unittest discover -s backend/tests -p test_native_cli.py -v
      - name: Update transactions
        working-directory: WinSecAgent
        run: python -X utf8 -m unittest discover -s backend/tests -p test_cli_update.py -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build both native editions
        working-directory: WinSecAgent
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python build_cli_releases.py --version "${RELEASE_TAG#cli-v}" --output ../release-assets
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "WinSecAgent CLI $RELEASE_TAG" --generate-notes
